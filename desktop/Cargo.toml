[package]
name = "huggler-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
huggler = { path = ".." }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, optional = true }

[features]
qualification = ["dep:serde", "dep:serde_json", "dep:objc2-app-kit", "dep:objc2-foundation"]
