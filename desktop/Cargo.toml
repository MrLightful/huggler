[package]
name = "huggler-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
huggler = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
