[package]
name = "huggler-desktop"
version = "0.0.1"
license = "MIT"
edition = "2024"
publish = false

[package.metadata.macos]
bundle-version = "3"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
huggler = { path = "..", features = ["application"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
markdown = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, optional = true }

[features]
qualification = ["objc2-app-kit/NSApplication", "objc2-app-kit/NSEvent", "objc2-app-kit/NSGraphicsContext", "objc2-app-kit/NSResponder", "objc2-app-kit/NSWindow", "dep:objc2-foundation"]
