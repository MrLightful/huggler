<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huggler</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><header><h1>Huggler</h1><button id="quit">Quit</button></header>
<main><nav aria-label="Conversations"><label>Conversation <select id="threads" disabled></select></label>
<button id="new">New conversation</button></nav>
<form id="launch"><label>Git checkout <input id="root" required placeholder="/path/to/project"></label>
<label>Conversation name <input id="name" required></label><button>Open conversation</button></form>
<section id="conversation" hidden><div id="messages" aria-live="polite"></div>
<form id="send"><label>Message <textarea id="prompt" required rows="3"></textarea></label>
<footer><output id="status" aria-live="polite"></output><button id="submit">Send</button></footer></form>
</section><p id="error" role="alert"></p></main></body></html>
