[package]
name = "huggler-python"
version = "0.0.1"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
huggler = { path = "../..", features = ["application"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
pyo3 = { version = "0.30", features = ["abi3-py311", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pythonize = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net"] }
tower = { version = "0.5", features = ["util"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
