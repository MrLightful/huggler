[package]
name = "huggler"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/MrLightful/huggler"
description = "Orchestrate durable coding-agent conversations in Rust applications"
include = ["src/**", "migrations/**", "Cargo.toml", "Cargo.lock", "tests/**", "!**/__pycache__/**", "!**/*.pyc", "docs/reference/codex-resume/{LICENSE,codex_transcript.ndjson,cursors.json,expected.txt}"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.10", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "macros"] }
uuid = { version = "1", features = ["v4","v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite = { version = "0.39", features = ["hooks"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
