name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.94.1'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/Cargo.toml -- --check
          cargo fmt --manifest-path bindings/node/native/Cargo.toml -- --check
      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test the default crate
        run: cargo test --locked
      - name: Test the crate with all features
        run: cargo test --locked --all-features
      - name: Verify the Cargo package with an independent consumer
        if: runner.os == 'Linux'
        run: python3 scripts/check-package.py

  desktop:
    name: Desktop (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          cache-bin: false
      - name: Check the production build
        run: cargo check --locked --manifest-path desktop/Cargo.toml
      - name: Lint the desktop qualification build
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --features qualification --all-targets -- -D warnings
      - name: Run desktop unit tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml --features qualification

  docs:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build and verify the static export
        run: |
          npm run build
          test -s out/index.html
          test -s out/search-index.json
