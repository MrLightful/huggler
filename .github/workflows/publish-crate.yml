name: Release crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.94.1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    name: Verify release
    if: github.repository == 'MrLightful/huggler' && github.ref == 'refs/heads/master'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Check crate version consistency
        run: python3 scripts/version-crate.py
      - name: Determine release tag
        id: version
        run: |
          tag=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          existing=$(git ls-remote origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Verify packaged consumer
        run: python3 scripts/check-package.py
      - name: Preview publication
        run: cargo publish --locked --dry-run --registry crates-io

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build package before authentication
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Authenticate with crates.io
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}

  github-release:
    name: Create GitHub tag and release
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Tag the published commit and create the release
        run: |
          ref="refs/tags/$TAG"
          existing=$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "$ref" "$ref^{}")
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" > /dev/null
          else
            commit=$(awk -v ref="$ref" '
              $2 == ref { tag = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled ? peeled : tag) }
            ' <<< "$existing")
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to $commit, expected $GITHUB_SHA"
              exit 1
            fi
          fi
          gh release view "$TAG" --json url --jq .url ||
            gh release create "$TAG" --verify-tag --title "Huggler $TAG" --generate-notes
