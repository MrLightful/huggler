name: Publish crate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.94.1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    name: Verify release
    if: github.repository == 'MrLightful/huggler'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Check release tag
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('Cargo.toml').read_text())['package']
          expected = f"v{package['version']}"
          if package['name'] != 'huggler' or os.environ['GITHUB_REF_NAME'] != expected:
              raise SystemExit(f'Release tag must be {expected} for the huggler package')
          PY
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Verify packaged consumer
        run: python3 scripts/check-package.py
      - name: Preview publication
        run: cargo publish --locked --dry-run --registry crates-io

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build package before authentication
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Authenticate with crates.io
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
