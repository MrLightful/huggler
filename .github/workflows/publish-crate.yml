name: Release crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.94.1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    name: Verify release
    if: github.repository == 'MrLightful/huggler' && github.ref == 'refs/heads/main'
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the released commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable release tag such as v0.1.0"
            exit 1
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$draft" != false ]]; then
            echo "::error::GitHub release $TAG is still a draft"
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
            echo "::error::Release $TAG must be reachable from main"
            exit 1
          fi
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Check crate version consistency
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/version-crate.py
          expected=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$TAG" != "$expected" ]]; then
            echo "::error::Expected release tag $expected for this crate, got $TAG"
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Verify packaged consumer
        run: python3 scripts/check-package.py
      - name: Preview publication
        run: cargo publish --locked --dry-run --registry crates-io

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build package before authentication
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Authenticate with crates.io
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
