name: Node bindings

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  packed-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
            container: rust:1.94.1-bookworm
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/node
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Install build prerequisites
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            apt-get update && apt-get install -y python3
          fi
          rustup toolchain install 1.94.1 --profile minimal --component rust-docs
          echo RUSTUP_TOOLCHAIN=1.94.1 >> "$GITHUB_ENV"
      - name: Build release tarballs
        run: |
          cargo install --locked cargo-about --version 0.9.1 --features cli
          cargo about --version
          npm ci --ignore-scripts
          npm run pack:local
      - name: Verify packed installs across Node versions
        run: |
          sdk=(packages/huggler-sdk-[0-9]*.tgz)
          binary=(packages/huggler-sdk-"$(node platform.cjs)"-*.tgz)
          for version in 22.14.0 22 24.0.0 24 26.0.0 26; do
            npm exec --yes --package="node@$version" -- node scripts/test-consumer.mjs "${sdk[0]}" "${binary[0]}"
          done
      - name: Test the Pi extension against the recorded provider
        if: runner.os == 'Linux'
        working-directory: .
        run: cargo test --locked --test provider_instances pi_extension_calls_scoped_tool -- --ignored --exact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huggler-node-${{ matrix.os }}-${{ github.run_attempt }}
          path: bindings/node/packages/*.tgz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
