name: Python bindings

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
            container: rust:1.94.1-bookworm
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Install build prerequisites
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            apt-get update && apt-get install -y python3-venv
          fi
          rustup toolchain install 1.94.1 --profile minimal --component rust-docs
          cargo install --locked cargo-about --version 0.9.1 --features cli
          python3 -m venv .context/python
          .context/python/bin/python -m pip install 'maturin==1.16.0'
      - name: Build and verify the installed wheel
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--compatibility manylinux_2_36)
          fi
          .context/python/bin/python bindings/python/scripts/build-wheel.py "${args[@]}"
          .context/python/bin/python -m pip install --no-deps bindings/python/dist/*.whl
          .context/python/bin/python bindings/python/tests/consumer.py -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huggler-python-${{ matrix.os }}-${{ github.run_attempt }}
          path: bindings/python/dist/*.whl
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
